<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenkraft — Tablou de Bord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; -webkit-font-smoothing: antialiased; background: #eef2f6; }
      /* Randul de sub cursor se inchide putin la culoare. Folosim brightness ca sa
         pastram culorile care inseamna ceva (achitat, din casa, totaluri) — doar le
         inchidem, nu le inlocuim. */
      tbody tr:hover > td { filter: brightness(0.955); }
      /* Bara de derulare a tabelelor, mai discreta */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #c3ccd6; border-radius: 6px; }
      ::-webkit-scrollbar-thumb:hover { background: #a3b0bd; }
      ::-webkit-scrollbar-track { background: #eef2f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
